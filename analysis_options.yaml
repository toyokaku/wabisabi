# Lints for the wabisabi kit.
#
# flutter_lints is the Flutter team's recommended set. The one rule the kit
# opts out of is constant_identifier_names: WAB_* SCREAMING_SNAKE is house
# style for tokens and predates the lint, and renaming every token is a
# breaking change for every consumer. Everything else applies.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - example/build/**

linter:
  rules:
    - prefer_single_quotes
    constant_identifier_names: false
